datasources:
  postgres:
    url: jdbc:postgresql://kestra-db:5432/kestra
    driver-class-name: org.postgresql.Driver
    username: kestra
    password: kestra

kestra:
  server:
    basic-auth:
      enabled: false
  repository:
    type: postgres
  queue:
    type: postgres
  storage:
    type: local
    local:
      base-path: /app/storage
  tasks:
    tmp-dir:
      path: /tmp/kestra-wd/tmp
  url: http://localhost:8080/

